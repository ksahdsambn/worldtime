# Docker Compose 部署配置
#
# 使用方式：
#   首次构建并后台启动：docker compose up -d --build
#   查看日志：           docker compose logs -f
#   停止：               docker compose down
#   自定义宿主端口：     PORT=8080 docker compose up -d --build
#
# 健康检查说明：
#   Next.js standalone 镜像基于 node:20-alpine，自带 wget（非 curl），
#   故 healthcheck 使用 wget --spider 探测应用根路由。

services:
  app:
    build: .
    container_name: worldtime
    ports:
      # 宿主端口可通过环境变量 PORT 自定义，默认 3000
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      # 用 127.0.0.1 而非 localhost：Alpine 中 localhost 解析到 IPv6 (::1)，
      # 而 Next.js standalone 默认监听 IPv4，用 localhost 会连接被拒。
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/zh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
